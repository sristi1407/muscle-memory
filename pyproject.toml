[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muscle-memory"
version = "0.1.0"
description = "Muscle Memory — discover once, replay free: deterministic capabilities for legacy UIs."
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "playwright>=1.44",
    "pydantic>=2.7",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
